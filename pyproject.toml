[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-portfolio"
version = "0.1.0"
description = "数据采集与分析作品集：三个可复现的完整小项目（Open-Meteo / GitHub / World Bank）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "heee-a" }]
keywords = ["data-collection", "data-analysis", "portfolio", "open-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["datap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
